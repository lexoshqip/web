name = "lexoshqip-s3-proxy"
main = "worker/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Dev environment
[env.dev]
workers_dev = true

# Production — mount on your Pages domain
# Uncomment and set your account_id + routes after creating the Pages project:
# [env.production]
# routes = [
#   { pattern = "lexoshqip.org/api/s3-proxy/*", zone_name = "lexoshqip.org" }
# ]

# Secrets (set via `wrangler secret put`):
#   S3_ACCESS_KEY_ID       — Backblaze B2 application key ID
#   S3_SECRET_ACCESS_KEY   — Backblaze B2 application key
#
# Optional vars:
#   S3_REGION              — defaults to "us-west-004"
